<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Krillion</title>
<meta name="theme-color" content="#0a1628">
<style>
  body{margin:0;background:#0a1628;color:#e8f0ff;font-family:system-ui,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:2rem}
  .box{max-width:400px}
  .icon{font-size:4rem;margin-bottom:16px;opacity:.5}
  h1{font-size:1.4rem;font-weight:700;margin:0 0 10px}
  p{color:#7a8fa8;font-size:.9rem;line-height:1.5;margin:0 0 22px}
  button{background:#4a9eff;color:#fff;border:none;padding:12px 28px;
    border-radius:24px;font-size:.9rem;font-weight:600;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">🌊</div>
    <h1>You've surfaced</h1>
    <p>Krillion needs a connection to score answers.<br>Reconnect and dive again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
